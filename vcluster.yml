# https://github.com/loft-sh/vind/blob/main/docs/configuration.md

controlPlane:
  # Configure the backing store for vCluster's data
  backingStore: # Enterprise feature - requires license
    etcd:
      embedded: 
        enabled: true  # Run etcd inside the vCluster pod

experimental:
  docker:
    nodes:
    - name: "worker-1"
      volumes:
        - "./data/vc1/n1:/data"
      env:
        - "NODE_ROLE=worker"
    - name: "worker-2"
      volumes:
        - "./data/vc1/n2:/data"
      env:
        - "NODE_ROLE=worker"
    - name: "worker-3"
      volumes:
        - "./data/vc1/n3:/data"
      env:
        - "NODE_ROLE=worker"

# Create the cluster with: (using sudo allows for load balancer services)
# sudo vcluster create my-vc1 -f vcluster.yml

# Tear down the cluster with:
# vcluster delete my-vc1

# Pause the cluster with:
# vcluster pause my-vc1

# Resume the cluster with:
# vcluster resume my-vc1