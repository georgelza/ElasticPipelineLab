# Filebeat configuration for Docker Compose
# This configuration collects logs from host system and forwards to Kafka

filebeat.inputs:
- type: log
  enabled: true
  paths:
    - /var/log/*.log
    - /var/lib/docker/containers/*.log
  fields:
    source: docker-compose-filebeat

output.kafka:
  hosts: ["broker:29092"]
  topic: "filebeat-logs"
  compression: gzip
  max_message_bytes: 1000000

processors:
  - add_host_metadata: ~
  - add_cloud_metadata: ~