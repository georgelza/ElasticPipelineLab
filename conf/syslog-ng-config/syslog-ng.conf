# Syslog-ng configuration file for Docker Compose deployment
@version: 3.28

# Global options
options {
    time-stamp(follow_system_tz(no));
    timestamp_format("%Y-%m-%dT%H:%M:%S.%NZ");
    log_msg_size(65536);
    use_dns(no);
    use_fqdn(no);
};

# Syslog input sources
source s_syslog {
    system();
    internal();
};

# Kafka output destination
destination d_kafka {
    kafka(
        bootstrap_servers("connect:8083")
        topic("syslog-topic")
        key("syslog")
    );
};

# Log path for Kafka
log {
    source(s_syslog);
    destination(d_kafka);
};