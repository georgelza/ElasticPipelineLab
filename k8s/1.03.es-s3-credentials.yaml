---
# ── Elasticsearch S3 (RustFS) credentials ─────────────────────────────────────
# Two mechanisms, both consumed by the bundled repository-s3 module:
#
# 1. `es-s3-keystore` — a pre-seeded Elasticsearch keystore containing the
#    secure settings `s3.client.default.access_key` / `s3.client.default.secret_key`.
#    ES 8.13's repository-s3 does NOT honour AWS_ACCESS_KEY_ID /
#    AWS_SECRET_ACCESS_KEY env vars (its fallback chain is the EC2 instance
#    metadata provider only), so the keystore is the source of truth. It is
#    mounted read-only into both ES pods at
#    /usr/share/elasticsearch/config/elasticsearch.keystore (see
#    k8s/1.02.elasticsearch.yaml).
#
# 2. `es-s3-credentials` — plain-text reference copy of the same access key /
#    secret key (kept for tooling such as aws CLI / make targets; not read by
#    Elasticsearch itself).
#
# Values mirror the Docker Compose RustFS root credentials (.env:
# S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY) — keep them in sync.
#
# Regenerate the keystore if the credentials change:
#   docker run --rm -u root -v "$PWD:/out" \
#     docker.elastic.co/elasticsearch/elasticsearch:8.13.4 sh -c \
#     'bin/elasticsearch-keystore create && \
#      printf "%s" "$ACCESS_KEY" | bin/elasticsearch-keystore add -x s3.client.default.access_key && \
#      printf "%s" "$SECRET_KEY" | bin/elasticsearch-keystore add -x s3.client.default.secret_key && \
#      cp /usr/share/elasticsearch/config/elasticsearch.keystore /out/'
#   then base64 the file into `es-s3-keystore` below and `kubectl apply -f k8s/1.*`
apiVersion: v1
kind: Secret
metadata:
  name: es-s3-credentials
  namespace: elastic
type: Opaque
stringData:
  access_key: "minio-access-key"
  secret_key: "minio-secret-key"
---
# Pre-seeded Elasticsearch keystore (binary). Contains:
#   s3.client.default.access_key = minio-access-key
#   s3.client.default.secret_key = minio-secret-key
# World-readable (0444) because ES runs as uid 1000 while k8s mounts secrets
# as root — the ES keystore loader accepts root-owned files.
apiVersion: v1
kind: Secret
metadata:
  name: es-s3-keystore
  namespace: elastic
type: Opaque
data:
  elasticsearch.keystore: ""
