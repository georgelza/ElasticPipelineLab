# ─────────────────────────────────────────────────────────────────────────────
# Traefik IngressRoutes – Elastic logging stack
# Namespace: ingress-traefik1
#
# Routes for the Elastic stack (Kibana + Elasticsearch) deployed by layers
# 1-3. The Traefik Deployment and Service are deployed separately in
# k8s/4.03.traefik-deploy.yaml, so the IngressRoutes can be updated without
# touching the Traefik deployment.
#
# All routes accessible via:
#
#   kubectl port-forward service/traefik1 -n ingress-traefik1 8080:80
#
#   http://localhost:8080/kibana          → Kibana
#   http://localhost:8080/elasticsearch   → Elasticsearch REST API
#
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-elasticsearch
  namespace: ingress-traefik1
spec:
  stripPrefix:
    prefixes:
      - /elasticsearch
---
# NOTE: No strip-prefix for /kibana.
# Kibana is configured with:
#   server.basePath: /kibana
#   server.rewriteBasePath: true
# so it handles its own prefix internally – Traefik must pass /kibana/* as-is.

# ── Main IngressRoute (entrypoint: web / port 80) ────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: elastic-ingress
  namespace: ingress-traefik1
spec:
  entryPoints:
    - web
  routes:
    # ── Kibana ────────────────────────────────────────────────────────────────
    # No strip-prefix: Kibana owns the /kibana prefix via server.basePath
    - match: PathPrefix(`/kibana`)
      kind: Rule
      services:
        - name: kibana
          namespace: elastic
          port: 5601

    # ── Elasticsearch API ─────────────────────────────────────────────────────
    # Expose the ES REST API under /elasticsearch (security disabled for this
    # local/homelab deployment). Prefix is stripped before forwarding.
    - match: PathPrefix(`/elasticsearch`)
      kind: Rule
      middlewares:
        - name: strip-elasticsearch
          namespace: ingress-traefik1
      services:
        - name: elasticsearch
          namespace: elastic
          port: 9200
