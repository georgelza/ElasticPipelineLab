# ─────────────────────────────────────────────────────────────────────────────
# Traefik prerequisites: namespace, ServiceAccount and RBAC
# Required for the providers used in 1.traefik-deploy.yaml:
#   --providers.kubernetescrd          (IngressRoute, Middleware, ...)
#   --providers.kubernetesingress      (Ingress resources)
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-traefik1
  labels:
    name: ingress-traefik1

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik1
  namespace: ingress-traefik1
  labels:
    app.kubernetes.io/instance: traefik1-ingress-traefik1
    app.kubernetes.io/name: traefik

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik1
  labels:
    app.kubernetes.io/instance: traefik1-ingress-traefik1
    app.kubernetes.io/name: traefik
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "secrets", "namespaces", "pods", "configmaps", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io", "extensions"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io", "extensions"]
    resources: ["ingresses/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["traefik.io"]
    resources:
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - middlewares
      - middlewaretcps
      - tlsoptions
      - tlsstores
      - serverstransports
      - serverstransporttcps
      - traefikservices
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io"]
    resources:
      - ingressroutes/status
      - ingressroutetcps/status
      - ingressrouteudps/status
      - middlewares/status
      - tlsoptions/status
      - tlsstores/status
      - serverstransports/status
      - traefikservices/status
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik1
  labels:
    app.kubernetes.io/instance: traefik1-ingress-traefik1
    app.kubernetes.io/name: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik1
subjects:
  - kind: ServiceAccount
    name: traefik1
    namespace: ingress-traefik1
