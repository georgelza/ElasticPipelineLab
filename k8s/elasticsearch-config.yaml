apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-config
  namespace: elastic
data:
  elasticsearch.yml: |
    cluster.name: "elastic-cluster"
    node.name: "elasticsearch-master"
    network.host: 0.0.0.0
    discovery.type: single-node
    # Security is disabled for this local/single-node homelab deployment.
    # Re-enable with an appropriately mounted PKCS12 keystore before exposing
    # this cluster beyond a trusted network.
    xpack.security.enabled: false
    # Storage settings
    path.data: /usr/share/elasticsearch/data
    path.logs: /usr/share/elasticsearch/logs
    # Performance settings
    indices.memory.index_buffer_size: 25%
    indices.fielddata.cache.size: 25%
    index.codec: best_compression