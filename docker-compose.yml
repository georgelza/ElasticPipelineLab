# docker-compose.yml
# ─────────────────────────────────────────────────────────────────────────────
#
# Usage:
#   docker compose up                      # start full stack  (all terminal output)
#   docker compose up -d                   # detached
#   docker compose down -v                 # stop + remove volumes
#
# ─────────────────────────────────────────────────────────────────────────────


services:
  # Core Confluent Kafka bits
  broker:
    image: confluentinc/cp-kafka:7.9.6
    container_name: broker
    hostname: broker
    ports:
      - "9092:9092"
      - "9101:9101"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      # Replace CLUSTER_ID with a unique base64 UUID using "bin/kafka-storage.sh random-uuid" 
      # See https://docs.confluent.io/kafka/operations-tools/kafka-tools.html#kafka-storage-sh
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.6
    container_name: schema-registry
    hostname: schema-registry
    depends_on:
      - broker
    ports:
      - "9081:9081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'broker:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:9081
      
  control-center:
    image: confluentinc/cp-enterprise-control-center:7.9.6.arm64
    container_name: control-center
    hostname: control-center
    depends_on:
      - broker
    ports:
      - "9021:9021"     # -> Web UI console
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: 'broker:29092'
      CONTROL_CENTER_CONNECT_CONNECT-DEFAULT_CLUSTER: 'connect:8083'
      CONTROL_CENTER_CONNECT_HEALTHCHECK_ENDPOINT: '/connectors'
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: "http://schema-registry:9081"
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      PORT: 9021

  connect:
    image: georgelza/kafka-connect-custom:3.3
    container_name: connect
    hostname: connect
    depends_on:
      - broker
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'broker:29092'
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: compose-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:9081
      # CLASSPATH required due to CC-2422
      CLASSPATH: /usr/share/java/monitoring-interceptors/monitoring-interceptors-7.6.1.jar
      CONNECT_PRODUCER_INTERCEPTOR_CLASSES: "io.confluent.monitoring.clients.interceptor.MonitoringProducerInterceptor"
      CONNECT_CONSUMER_INTERCEPTOR_CLASSES: "io.confluent.monitoring.clients.interceptor.MonitoringConsumerInterceptor"
      CONNECT_LOG4J_LOGGERS: org.apache.zookeeper=ERROR,org.I0Itec.zkclient=ERROR,org.reflections=ERROR

  kcat:
    image: confluentinc/cp-kcat:latest
    container_name: kcat
    hostname: kcat
    depends_on:
      - broker
    entrypoint: /bin/bash -i
    tty: true

  # Syslog-ng collector service (for OS-level log collection)
  syslog-ng:
    image: linuxserver/syslog-ng
    container_name: syslog-ng
    hostname: syslog-ng
    ports:
      - "514:5514/udp"   # Standard Syslog UDP
      - "601:6601/tcp"   # Standard Syslog TCP
    environment:
      - PUID=1000        # Match your local user ID to avoid permission issues
      - PGID=1000        # Match your local group ID
      - TZ=Etc/UTC       # Set your desired timezone
    volumes:
      - ./conf/syslog-ng-config:/config       # Location for your custom syslog-ng.conf
      - ./logs:/var/log/syslog # Destination folder where logs will accumulate
    depends_on:
      - connect
    networks:
      - elastic

   # RustFS S3 storage service 
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    hostname: rustfs
    ports:
      - "8080:8080"
    environment:
      - RUSTFS_S3_ENDPOINT=${S3_ENDPOINT}
      - RUSTFS_S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - RUSTFS_S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - RUSTFS_S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - RUSTFS_S3_REGION=${S3_REGION}
    volumes:
      - ./data/rustfs:/data
    depends_on:
      - broker
    networks:
      - elastic

  # Filebeat service for collecting logs and forwarding to Kafka
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.14.0
    container_name: filebeat
    hostname: filebeat
    user: root
    command: filebeat -e -c /etc/filebeat/filebeat.yml
    volumes:
      - ./conf/filebeat.yml:/etc/filebeat/filebeat.yml
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers
    depends_on:
      - broker
    networks:
      - elastic
    healthcheck:
      test: ["CMD-SHELL", "filebeat test config -e"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  elastic:
    driver: bridge
  
  default:
    name: elastic
