# Syslog-ng configuration — canonical source.
#
# Runs on the official balabit/syslog-ng image (which includes the native
# librdkafka-based Kafka module), publishing DIRECTLY to the Kafka broker —
# no intermediate file / Filebeat hop.
#
# Pipeline:  host syslog (UDP 514 / TCP 601) -> syslog-ng -> Kafka logs-prod-nonpci-syslog
#
# `make run` provisions this file into ./data/syslog-ng/config/syslog-ng.conf,
# which the compose service mounts at /etc/syslog-ng/syslog-ng.conf.
#
# Payloads are JSON (format-json) with an @timestamp pair, so the Kafka
# Connect Elasticsearch sink connector (JsonConverter, schemas.enable=false)
# can index them directly.
#
# NOTE (syslog-ng 4.x syntax): option/driver names use HYPHENS
# (e.g. bootstrap-servers, keep-timestamp), not underscores.
#
@version: 4.2
@include "scl.conf"

# Global options
options {
    keep-timestamp(no);
    ts-format("iso");
    frac-digits(3);
    log-msg-size(65536);
    use-dns(no);
    use-fqdn(no);
};

# Syslog input sources (UDP/TCP exposed by the container).
# No system() source — /dev/log is not available inside this container.
source s_syslog {
    internal();
    udp(ip(0.0.0.0) port(5514));
    tcp(ip(0.0.0.0) port(6601));
};

# Kafka output destination.
# bootstrap-servers MUST point at the Kafka BROKER (broker:29092), NOT at
# Kafka Connect (connect:8083) — connect:8083 is the Connect REST API.
# Topic follows the logs-<account>-<source> convention (account "prod-nonpci",
# our simulated lab account) so the ES sink connector can subscribe to the
# account's whole feed family with a logs-prod-nonpci-.* wildcard.
destination d_kafka {
    kafka(
        bootstrap-servers("broker:29092")
        topic("logs-prod-nonpci-syslog")
        key("syslog")
        # RFC5424 + name-value pairs serialised as JSON; @timestamp is set
        # from ISODATE so the Kibana data view can use it as the time field.
        message('$(format-json --scope rfc5424 --scope nv-pairs --pair @timestamp="${ISODATE}")')
    );
};

# Log path: syslog -> Kafka
log {
    source(s_syslog);
    destination(d_kafka);
};
