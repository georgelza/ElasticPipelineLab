# Syslog-ng configuration — canonical source.
#
# This file is the single source of truth for the syslog-ng service. `make run`
# provisions it into ./data/syslog-ng/config/syslog-ng.conf (the LinuxServer
# image mounts that directory at /config), so edits should be made here.
#
# Pipeline:  host syslog (UDP 514 / TCP 601) -> syslog-ng -> Kafka
# Topic:     syslog-topic  (broker:29092, internal Compose listener)
#
# Payloads are emitted as JSON (format-json) so the Kafka Connect
# Elasticsearch sink connector (JsonConverter, schemas.enable=false) can
# index them directly.
#
@version: 4.2

# Global options
options {
    time-stamp(follow_system_tz(no));
    timestamp_format("%Y-%m-%dT%H:%M:%S.%NZ");
    log_msg_size(65536);
    use_dns(no);
    use_fqdn(no);
};

# Syslog input sources (UDP/TCP exposed by the LinuxServer container)
source s_syslog {
    system();
    internal();
    udp(ip(0.0.0.0) port(5514));
    tcp(ip(0.0.0.0) port(6601));
};

# Kafka output destination.
# NOTE: bootstrap_servers MUST point at the Kafka broker (broker:29092), NOT
# at Kafka Connect (connect:8083) — connect:8083 is the Connect REST API.
destination d_kafka {
    kafka(
        bootstrap_servers("broker:29092")
        topic("syslog-topic")
        key("syslog")
        # RFC5424 + name-value pairs serialised as JSON; ISODATE is the
        # timestamp field used by the Kibana data view.
        value("$(format-json --scope rfc5424 --scope nv-pairs)\n")
        config(compression.type("snappy"))
    );
};

# Log path: syslog -> Kafka
log {
    source(s_syslog);
    destination(d_kafka);
};
