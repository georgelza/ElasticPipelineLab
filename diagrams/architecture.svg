<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg width="1600" height="950" viewBox="0 0 1600 950" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">  <defs>    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>    </filter>        <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">      <stop offset="0%" stop-color="#0f172a" />      <stop offset="100%" stop-color="#1e293b" />    </linearGradient>    <linearGradient id="spokeGrad" x1="0%" y1="0%" x2="0%" y2="100%">      <stop offset="0%" stop-color="#eff6ff" />      <stop offset="100%" stop-color="#dbeafe" />    </linearGradient>    <linearGradient id="secGrad" x1="0%" y1="0%" x2="0%" y2="100%">      <stop offset="0%" stop-color="#ffffff" />      <stop offset="100%" stop-color="#f8fafc" />    </linearGradient>    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>    </marker>    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>    </marker>    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>    </marker>    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9333ea"/>    </marker>  </defs>  <!-- Background -->  <rect width="100%" height="100%" fill="#f1f5f9" />  <!-- Header Banner -->  <rect x="0" y="0" width="1600" height="90" fill="url(#headerGrad)" />  <text x="800" y="42" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">AWS Multi-Account Log Analytics Pipeline Architecture (To-Be)</text>  <text x="800" y="68" text-anchor="middle" fill="#94a3b8" font-size="14">Central Security Ingestion via AWS MSK, Kafka Connect, EKS Elasticsearch &amp; S3 Tiered Storage</text>  <!-- SPOKE ACCOUNTS BOX -->  <rect x="40" y="110" width="620" height="800" rx="16" fill="url(#spokeGrad)" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,6" filter="url(#shadow)" />  <text x="70" y="150" fill="#1d4ed8" font-size="20" font-weight="bold">Spoke Accounts (~28 AWS Accounts)</text>  <text x="70" y="172" fill="#2563eb" font-size="13">Distributed Workloads across EC2 Instances and EKS Clusters</text>  <!-- EKS Workloads Box -->  <rect x="70" y="200" width="560" height="150" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)" />  <text x="90" y="230" fill="#0f172a" font-size="16" font-weight="bold">EKS Clusters Workloads</text>  <rect x="100" y="248" width="500" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1" />  <text x="350" y="280" text-anchor="middle" fill="#1e40af" font-size="15" font-weight="bold">FluentBit (DaemonSet / Pods)</text>  <text x="350" y="305" text-anchor="middle" fill="#334155" font-size="13">Publishes container log streams directly to MSK topics</text>  <!-- EC2 Workloads Box -->  <rect x="70" y="370" width="560" height="520" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)" />  <text x="90" y="400" fill="#0f172a" font-size="16" font-weight="bold">EC2 Instances &amp; Syslog Agents</text>  <!-- Option A -->  <rect x="100" y="420" width="500" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1" />  <text x="120" y="450" fill="#1d4ed8" font-size="14" font-weight="bold">Option A: Syslog Forwarder (syslog-ng)</text>  <text x="120" y="475" fill="#334155" font-size="12.5">• EC2 Syslog Agent → Local syslog-ng forwarder instance</text>  <text x="120" y="500" fill="#334155" font-size="12.5">• syslog-ng process publishes logs directly to MSK topics</text>  <!-- Option B -->  <rect x="100" y="550" width="500" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1" />  <text x="120" y="580" fill="#1d4ed8" font-size="14" font-weight="bold">Option B: Elastic Beats Direct (*Beat)</text>  <text x="120" y="605" fill="#334155" font-size="12.5">• FileBeat / WinlogBeat / *Beat installed directly on EC2s</text>  <text x="120" y="630" fill="#334155" font-size="12.5">• Directly publishes structured log events to MSK</text>  <!-- Option C -->  <rect x="100" y="680" width="500" height="180" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1" />  <text x="120" y="710" fill="#1d4ed8" font-size="14" font-weight="bold">Option C: FileBeat + syslog-ng Combined Pipeline</text>  <text x="120" y="735" fill="#334155" font-size="12.5">• Syslog agents forward events to local syslog-ng process</text>  <text x="120" y="760" fill="#334155" font-size="12.5">• FileBeat configured to consume syslog-ng output logs</text>  <text x="120" y="785" fill="#334155" font-size="12.5">• FileBeat publishes batches directly onto MSK topics</text>  <text x="120" y="810" fill="#64748b" font-size="12" font-style="italic">• Provides local buffering, transformation &amp; backpressure handling</text>  <!-- CENTRAL SECURITY ACCOUNT BOX -->  <rect x="760" y="110" width="800" height="800" rx="16" fill="url(#secGrad)" stroke="#0f172a" stroke-width="2" filter="url(#shadow)" />  <text x="790" y="150" fill="#0f172a" font-size="20" font-weight="bold">Central Security Account (sec-proxy)</text>  <text x="790" y="172" fill="#475569" font-size="13">Centralized Log Ingestion, Elastic Stack Cluster &amp; S3 Storage Lifecycle</text>  <!-- AWS MSK Box -->  <rect x="790" y="200" width="350" height="300" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)" />  <text x="810" y="235" fill="#14532d" font-size="17" font-weight="bold">AWS MSK (Kafka Cluster)</text>  <text x="810" y="265" fill="#166534" font-size="13">• Exposed via PrivateLink / VPC Peering</text>  <text x="810" y="290" fill="#14532d" font-size="13" font-weight="bold">• Dedicated Topic per Account:</text>  <g font-family="monospace" font-size="12" fill="#15803d">    <text x="830" y="315">topic-account-01</text>    <text x="830" y="335">topic-account-02</text>    <text x="830" y="355">topic-account-03</text>    <text x="830" y="375">...</text>    <text x="830" y="395">topic-account-28</text>  </g>  <text x="810" y="470" fill="#14532d" font-size="12.5" font-weight="bold">• Multi-AZ Broker High Availability</text>  <!-- Kafka Connect Box -->  <rect x="1180" y="200" width="350" height="300" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)" />  <text x="1200" y="235" fill="#78350f" font-size="17" font-weight="bold">Kafka Connect Cluster</text>  <text x="1200" y="265" fill="#92400e" font-size="13">• Elasticsearch Sink Connector</text>  <text x="1200" y="295" fill="#92400e" font-size="13">• Consumes all ~28 account topics</text>  <text x="1200" y="325" fill="#92400e" font-size="13">• High Availability Architecture:</text>  <text x="1220" y="350" fill="#b45309" font-size="14" font-weight="bold">  Replicas ≥ 2</text>  <text x="1200" y="385" fill="#92400e" font-size="13">• Automatic Failover &amp; Scaling</text>  <text x="1200" y="415" fill="#92400e" font-size="13">• Dead Letter Queue (DLQ) support</text>  <text x="1200" y="445" fill="#92400e" font-size="13">• Schema transformation &amp; sink</text>  <!-- EKS Elastic Stack Box -->  <rect x="790" y="520" width="740" height="200" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5" filter="url(#shadow)" />  <text x="810" y="555" fill="#581c87" font-size="17" font-weight="bold">EKS Cluster (sec-proxy) — Elastic Stack (Replicas ≥ 2)</text>  <rect x="810" y="575" width="450" height="120" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1" />  <text x="830" y="605" fill="#6b21a8" font-size="15" font-weight="bold">Elasticsearch Cluster</text>  <text x="830" y="630" fill="#334155" font-size="12.5">• Master, Data, Ingest Nodes (All Replicas ≥ 2)</text>  <text x="830" y="655" fill="#334155" font-size="12.5">• Hot/Warm Index Lifecycle Management (ILM)</text>  <text x="830" y="680" fill="#6b21a8" font-size="12.5" font-weight="bold">• Active log storage window &lt; 3 months</text>  <rect x="1280" y="575" width="230" height="120" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1" />  <text x="1300" y="605" fill="#6b21a8" font-size="15" font-weight="bold">Kibana / UI</text>  <text x="1300" y="630" fill="#6b21a8" font-size="13" font-weight="bold">• Replicas ≥ 2</text>  <text x="1300" y="655" fill="#334155" font-size="12.5">• Security Analytics</text>  <text x="1300" y="680" fill="#334155" font-size="12.5">• Dashboards &amp; Alerting</text>  <!-- S3 Storage Box -->  <rect x="790" y="740" width="740" height="140" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)" />  <text x="810" y="770" fill="#9a3412" font-size="16" font-weight="bold">AWS S3 Tiered Storage (Cold / Frozen Log Archival &gt; 3 Months)</text>  <text x="810" y="795" fill="#c2410c" font-size="13" font-weight="bold">Single Central S3 Bucket Key Structure:</text>  <rect x="810" y="810" width="700" height="45" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="0.8" />  <text x="825" y="838" fill="#9a3412" font-size="13.5" font-weight="bold" font-family="monospace">s3://&lt;sec-proxy-log-bucket&gt;/&lt;account name&gt;/year=&lt;XX&gt;/month=&lt;YY&gt;/day=&lt;ZZ&gt;/&lt;instance id or hostname&gt;/</text>  <!-- CONNECTING ARROWS -->  <!-- Spoke -> MSK -->  <g stroke="#2563eb" stroke-width="2.5" fill="none">    <path d="M 600,280 L 780,280" marker-end="url(#arrowBlue)" />    <path d="M 600,475 L 780,320" marker-end="url(#arrowBlue)" />    <path d="M 600,605 L 780,360" marker-end="url(#arrowBlue)" />    <path d="M 600,770 L 780,410" marker-end="url(#arrowBlue)" />  </g>  <!-- Ingestion Badge -->  <rect x="645" y="340" width="110" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1" />  <text x="700" y="362" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="bold">Cross-Account</text>  <text x="700" y="378" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="bold">Log Ingestion</text>  <!-- MSK -> KC -->  <path d="M 1140,350 L 1170,350" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#arrowGreen)" />  <text x="1160" y="340" text-anchor="middle" fill="#16a34a" font-size="12" font-weight="bold">Topic Stream</text>  <!-- KC -> ES -->  <path d="M 1355,500 L 1355,510 L 1100,510 L 1100,565" stroke="#d97706" stroke-width="3" fill="none" marker-end="url(#arrowAmber)" />  <text x="1220" y="505" text-anchor="middle" fill="#d97706" font-size="12" font-weight="bold">Kafka Connect ES Sink</text>  <!-- ES -> S3 -->  <path d="M 1035,695 L 1035,730" stroke="#9333ea" stroke-width="3" fill="none" marker-end="url(#arrowPurple)" />  <text x="1120" y="718" text-anchor="middle" fill="#9333ea" font-size="12" font-weight="bold">Offload Logs &gt; 3 Months</text></svg>