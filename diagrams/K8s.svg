<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead Marker -->
    <marker id="arrow2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5568" />
    </marker>
    <!-- Drop Shadow Filter -->
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="425" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1A202C">Kubernetes Elastic Stack Deployment</text>

  <!-- External Inbound Node: Kafka Connect -->
  <rect x="40" y="220" width="130" height="60" rx="6" fill="#E2E8F0" stroke="#718096" stroke-width="1.5" stroke-dasharray="3" filter="url(#shadow2)"/>
  <text x="105" y="247" text-anchor="middle" font-size="12" font-weight="600" fill="#2D3748">Kafka Connect</text>
  <text x="105" y="263" text-anchor="middle" font-size="10" fill="#718096">(External Feed)</text>

  <!-- Outer Container: elastic namespace -->
  <rect x="220" y="60" width="370" height="400" rx="8" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="2" stroke-dasharray="4" filter="url(#shadow2)"/>
  <text x="235" y="85" font-size="14" font-weight="bold" fill="#4A5568">elastic namespace</text>

  <!-- Nodes inside elastic namespace -->
  <!-- Elasticsearch -->
  <rect x="250" y="220" width="140" height="60" rx="6" fill="#ADD8E6" stroke="#4682B4" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="320" y="255" text-anchor="middle" font-size="13" font-weight="600" fill="#1A202C">Elasticsearch</text>

  <!-- Kibana -->
  <rect x="420" y="120" width="140" height="60" rx="6" fill="#ADD8E6" stroke="#4682B4" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="490" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#1A202C">Kibana</text>

  <!-- FluentBit -->
  <rect x="420" y="320" width="140" height="60" rx="6" fill="#90EE90" stroke="#2E8B57" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="490" y="355" text-anchor="middle" font-size="13" font-weight="600" fill="#1A202C">FluentBit</text>

  <!-- External Outbound Node: RustFS -->
  <rect x="650" y="220" width="130" height="60" rx="6" fill="#E2E8F0" stroke="#718096" stroke-width="1.5" stroke-dasharray="3" filter="url(#shadow2)"/>
  <text x="715" y="247" text-anchor="middle" font-size="12" font-weight="600" fill="#2D3748">RustFS</text>
  <text x="715" y="263" text-anchor="middle" font-size="10" fill="#718096">(External Target)</text>

  <!-- Connections -->
  <!-- Inbound: Kafka Connect -> Elasticsearch -->
  <path d="M 170 250 L 250 250" fill="none" stroke="#2B6CB0" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Elasticsearch -> Kibana -->
  <path d="M 360 220 L 430 180" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- FluentBit -> Elasticsearch -->
  <path d="M 430 320 L 360 280" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Outbound: Elasticsearch -> RustFS -->
  <path d="M 390 250 L 650 250" fill="none" stroke="#C53030" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Notes -->
  <!-- Note for Kibana -->
  <path d="M 560 150 L 630 150" fill="none" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="2"/>
  <polygon points="630,135 800,135 810,145 810,165 630,165" fill="#FEFCBF" stroke="#D69E2E" stroke-width="1" filter="url(#shadow2)"/>
  <polyline points="800,135 800,145 810,145" fill="none" stroke="#D69E2E" stroke-width="1"/>
  <text x="640" y="152" font-size="11" fill="#744210">Data visualization interface</text>

  <!-- Note for FluentBit -->
  <path d="M 560 350 L 630 350" fill="none" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="2"/>
  <polygon points="630,335 800,335 810,345 810,365 630,365" fill="#FEFCBF" stroke="#D69E2E" stroke-width="1" filter="url(#shadow2)"/>
  <polyline points="800,335 800,345 810,345" fill="none" stroke="#D69E2E" stroke-width="1"/>
  <text x="640" y="352" font-size="11" fill="#744210">Log processor and forwarder</text>

  <!-- Note for Outbound Feed -->
  <path d="M 520 250 L 520 200 L 630 200" fill="none" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="2"/>
  <polygon points="630,185 810,185 820,195 820,215 630,215" fill="#FEFCBF" stroke="#D69E2E" stroke-width="1" filter="url(#shadow2)"/>
  <polyline points="810,185 810,195 820,195" fill="none" stroke="#D69E2E" stroke-width="1"/>
  <text x="640" y="202" font-size="11" fill="#744210">Outbound data export/backup</text>
</svg>
