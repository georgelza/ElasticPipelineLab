<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5568" />
    </marker>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1A202C">Docker Compose Infrastructure Stack</text>

  <!-- Outer Container: docker-compose.yml -->
  <rect x="40" y="60" width="540" height="470" rx="8" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="2" stroke-dasharray="4" filter="url(#shadow)"/>
  <text x="55" y="85" font-size="14" font-weight="bold" fill="#4A5568">docker-compose.yml</text>

  <!-- Nodes inside docker-compose.yml -->
  <!-- Kafka Broker -->
  <rect x="70" y="240" width="140" height="60" rx="6" fill="#ADD8E6" stroke="#4682B4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="275" text-anchor="middle" font-size="13" font-weight="600" fill="#1A202C">Kafka Broker</text>

  <!-- Kafka Connect -->
  <rect x="290" y="110" width="140" height="60" rx="6" fill="#ADD8E6" stroke="#4682B4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="#1A202C">Kafka Connect</text>

  <!-- Schema Registry -->
  <rect x="290" y="200" width="140" height="60" rx="6" fill="#ADD8E6" stroke="#4682B4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="235" text-anchor="middle" font-size="13" font-weight="600" fill="#1A202C">Schema Registry</text>

  <!-- Control Center -->
  <rect x="290" y="290" width="140" height="60" rx="6" fill="#ADD8E6" stroke="#4682B4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#1A202C">Control Center</text>

  <!-- Syslog-ng -->
  <rect x="290" y="380" width="140" height="60" rx="6" fill="#90EE90" stroke="#2E8B57" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="415" text-anchor="middle" font-size="13" font-weight="600" fill="#1A202C">Syslog-ng</text>

  <!-- RustFS -->
  <rect x="70" y="440" width="140" height="60" rx="6" fill="#FFFFE0" stroke="#DAA520" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="475" text-anchor="middle" font-size="13" font-weight="600" fill="#1A202C">RustFS</text>

  <!-- Storage Volumes Container -->
  <rect x="40" y="560" width="200" height="90" rx="8" fill="#F7FAFC" stroke="#CBD5E0" stroke-width="2" stroke-dasharray="4" filter="url(#shadow)"/>
  <text x="55" y="585" font-size="14" font-weight="bold" fill="#4A5568">Storage Volumes</text>

  <!-- ./data/rustfs Node -->
  <rect x="70" y="595" width="140" height="45" rx="6" fill="#F08080" stroke="#CD5C5C" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="622" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">./data/rustfs</text>

  <!-- Connections -->
  <!-- Kafka Broker <-> Kafka Connect -->
  <path d="M 210 255 L 290 155" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 290 140 L 210 240" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Kafka Broker -> Schema Registry -->
  <path d="M 210 260 L 290 235" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Kafka Connect -> Schema Registry -->
  <path d="M 360 170 L 360 200" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Kafka Broker -> Control Center -->
  <path d="M 210 280 L 290 310" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Syslog-ng -> Kafka Broker (Pushes to Kafka) -->
  <path d="M 290 395 L 210 300" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- RustFS -> ./data/rustfs -->
  <path d="M 140 500 L 140 595" fill="none" stroke="#4A5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Notes -->
  <!-- Note for Syslog-ng -->
  <path d="M 430 410 L 610 410" fill="none" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="2"/>
  <polygon points="610,385 790,385 800,395 800,435 610,435" fill="#FEFCBF" stroke="#D69E2E" stroke-width="1" filter="url(#shadow)"/>
  <polyline points="790,385 790,395 800,395" fill="none" stroke="#D69E2E" stroke-width="1"/>
  <text x="620" y="403" font-size="11" fill="#744210">Pushes syslog logs to</text>
  <text x="620" y="420" font-size="11" fill="#744210">Kafka Broker</text>

  <!-- Note for RustFS -->
  <path d="M 210 470 L 610 470" fill="none" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="2"/>
  <polygon points="610,448 770,448 780,458 780,492 610,492" fill="#FEFCBF" stroke="#D69E2E" stroke-width="1" filter="url(#shadow)"/>
  <polyline points="770,448 770,458 780,458" fill="none" stroke="#D69E2E" stroke-width="1"/>
  <text x="620" y="465" font-size="11" fill="#744210">S3-compatible storage</text>
  <text x="620" y="482" font-size="11" fill="#744210">on port 8080</text>

  <!-- Note for Kafka Broker -->
  <path d="M 140 240 L 140 180 L 610 180" fill="none" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="2"/>
  <polygon points="610,165 760,165 770,175 770,195 610,195" fill="#FEFCBF" stroke="#D69E2E" stroke-width="1" filter="url(#shadow)"/>
  <polyline points="760,165 760,175 770,175" fill="none" stroke="#D69E2E" stroke-width="1"/>
  <text x="620" y="182" font-size="11" fill="#744210">Message broker for logs</text>
</svg>
